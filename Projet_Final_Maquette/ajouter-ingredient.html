<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un ingrédient - Harmonie Gourmande</title>
    <link rel="icon" type="image/svg+xml" href="Images/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lavishly+Yours&family=Pacifico&family=Parisienne&display=swap"

<body>
    <header>
        <div class="top-header">
            <div class="logo">
                <a href="index.html"><img src="Images/logo.jpg" alt="Logo"></a>
            </div>
            <div class="site-title">
                <h1>Harmonie Gourmande</h1>
            </div>
        </div>

    <nav>
        <a href="index.html">Accueil</a>
        <a href="creer.html">Créer Recette</a>
        <a href="ingredients.html">Liste des ingrédients</a>
    </nav>

    <div class="container">
        <h2>Ajout d'un Ingrédient</h2>

        <form>
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" placeholder="ex: Courgette, Poulet, Beurre ..." required>
            </div>

            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <input type="text" id="categorie" placeholder="ex: Légume, Viande, Produit laitier ..." required>
            </div>

            <button type="submit">Ajouter</button>
        </form>
    </div>

    <footer>
        <div class="contact">
            <span>Pour nous contacter :</span><br>
            <span>- Email : contact@harmoniegourmande.fr</span><br>
            <span>- Téléphone : 01 02 03 04 05</span><br>

        </div>
    </footer>
